[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "httpx2-k8s"
version = "0.1.0"
description = "A small, strictly typed Kubernetes client built on HTTPX2"
readme = "README.md"
requires-python = ">=3.11"
license = "BSD-3-Clause"
authors = [{ name = "Marcelo Trylesinski" }]
keywords = ["httpx2", "kubernetes", "k8s", "typed"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: BSD License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
]
dependencies = [
    "httpx2[http2,ws]>=2.10.0,<3",
    "pydantic>=2.11,<3",
    "pyyaml>=6.0,<7",
    "typing-extensions>=4.14,<5",
]

[dependency-groups]
dev = [
    "hypothesis>=6.135,<7",
    "pyrefly>=1.2,<1.3",
    "pytest>=8.4,<9",
    "pytest-cov>=6.2,<7",
    "ruff>=0.12,<1",
    "testcontainers[k3s]>=4.12,<5",
    "types-pyyaml>=6.0,<7",
]

[tool.hatch.build.targets.wheel]
packages = ["src/httpx2_k8s"]

[tool.hatch.build.targets.sdist]
include = [
    "/CHANGELOG.md",
    "/LICENSE",
    "/README.md",
    "/docs",
    "/pyproject.toml",
    "/src",
]

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers --cov=httpx2_k8s --cov-branch --cov-report=term-missing --cov-fail-under=100"
testpaths = ["tests"]
markers = [
    "integration: requires Docker and starts a real K3s cluster",
]

[tool.coverage.run]
source = ["httpx2_k8s"]

[tool.coverage.report]
fail_under = 100
show_missing = true
skip_covered = true

[tool.pyrefly]
preset = "strict"
project-includes = ["src", "tests"]
search-path = ["src", "."]
python-version = "3.11"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["B", "E", "F", "I", "RUF", "SIM", "UP"]
ignore = [
    "COM812",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]
