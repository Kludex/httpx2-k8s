name: Publish

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.14"
          enable-cache: true
      - run: uv sync --frozen
      - name: Validate release version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: test "v$(uvx uv-dynamic-versioning==0.14.0)" = "${RELEASE_TAG}"
      - run: uv run pytest -m "not integration"
      - run: uv run pyrefly check
      - run: uv run ruff format --check .
      - run: uv run ruff check .
      - run: uv run python scripts/compliance_report.py --check
      - run: uv build --no-sources --clear
      - run: uv publish --dry-run --trusted-publishing never dist/*
      - name: Verify the built wheel against the official inventory
        run: |
          uv venv "$RUNNER_TEMP/package-check"
          uv pip install --python "$RUNNER_TEMP/package-check/bin/python" dist/*.whl
          "$RUNNER_TEMP/package-check/bin/python" scripts/wheel_compliance.py
      - uses: actions/upload-artifact@v4
        with:
          name: python-distributions
          path: dist/
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: python-distributions
          path: dist/
      - uses: astral-sh/setup-uv@v7
      - run: uv publish --trusted-publishing always dist/*
